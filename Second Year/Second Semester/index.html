<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>عرض البيانات الأكاديمية - النسخة المطورة</title>
  <!-- استدعاء خط Cairo من Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- استدعاء Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  
  <!-- استدعاء DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.10.21/css/dataTables.bootstrap4.min.css" />
  
  <style>
    /* تخصيص الخطوط للخطوط العربية */
    body {
      font-family: 'Cairo', sans-serif;
      direction: rtl;
      background-color: #f4f7fa;
      color: #333;
      padding-top: 70px;
      transition: background-color 0.3s, color 0.3s;
    }

    /* نمط الوضع المظلم */
    .dark-mode {
      background-color: #333;
      color: #ddd;
    }

    .dark-mode table,
    .dark-mode .card {
      background-color: #444;
      color: #ddd;
    }

    .container {
      max-width: 1200px;
    }

    /* تحسين تصميم الجداول */
    .table th, .table td {
      text-align: center;
      vertical-align: middle;
    }

    .section-title {
      font-size: 28px;
      margin: 30px 0 20px;
      border-bottom: 2px solid #4CAF50;
      padding-bottom: 10px;
    }

    /* زر الوضع المظلم */
    #toggleMode {
      background-color: #4CAF50;
      color: white;
      border-radius: 20px;
      padding: 5px 15px;
      cursor: pointer;
    }

    /* بطاقة المادة */
    .card-header {
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }

    .card {
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    .spinner {
      width: 3rem;
      height: 3rem;
      border: 0.3rem solid #f3f3f3;
      border-top: 0.3rem solid #4CAF50;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: auto;
      display: block;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* تأثير البحث */
    .highlight {
      background-color: #ffcc00;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <!-- شريط تنقل ثابت -->
  <nav class="navbar fixed-top navbar-expand-lg navbar-dark" style="background-color: #4CAF50;">
    <div class="container">
      <a class="navbar-brand" href="#">البيانات الأكاديمية</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarContent" 
              aria-controls="navbarContent" aria-expanded="false">
        <span class="navbar-toggler-icon"></span>
      </button>
      <button id="toggleMode" class="btn btn-outline-light ml-auto">وضع مظلم</button>
    </div>
  </nav>

  <div class="container">
    <h1 class="text-center mt-4">عرض البيانات الأكاديمية - النسخة المطورة</h1>

    <!-- مدخل البحث الشامل -->
    <div class="form-group mt-4">
      <input type="text" id="searchInput" class="form-control" placeholder="ابحث عن اسم الطالب أو المادة..." />
    </div>

    <!-- جدول ترتيب الطلاب (سيتم تفعيله بواسطة DataTables) -->
    <div class="section-title">ترتيب الطلاب</div>
    <div class="table-responsive">
      <table id="students-table" class="table table-bordered table-hover">
        <thead>
          <tr>
            <th>اسم الطالب</th>
            <th>CGPA</th>
            <th>الترتيب العام</th>
            <th>GPA الترم الثاني</th>
            <th>ترتيب الترم</th>
          </tr>
        </thead>
        <tbody>
          <!-- سيتم تعبئتها بواسطة JavaScript -->
        </tbody>
      </table>
    </div>

    <!-- ترتيب المواد داخل بطاقات قابلة للطي -->
    <div class="section-title">ترتيب المواد</div>
    <div id="courses-ranking">
      <!-- سيتم تعبئتها بواسطة JavaScript -->
    </div>

    <!-- مؤشر التحميل -->
    <div id="loading" class="my-5">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- استدعاء jQuery و Bootstrap JS و DataTables JS -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.10.21/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.10.21/js/dataTables.bootstrap4.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    let studentsTable;

    // دالة لتوليد معرف آمن من اسم المادة
    function generateSafeId(courseName) {
      let safeId = courseName.replace(/\s+/g, '');
      safeId = safeId.replace(/[^\w\u0600-\u06FF]/gi, '');
      return safeId;
    }

    // تحميل البيانات من ملفات JSON
    async function loadData() {
      try {
        const studentsResponse = await fetch('processed_data.json');
        const studentsData = await studentsResponse.json();
        
        const courseResponse = await fetch('course_ranks.json');
        const courseData = await courseResponse.json();
        
        populateStudentsTable(studentsData);
        
        studentsTable = $('#students-table').DataTable();
        
        populateCourseRankings(courseData);
        
        document.getElementById('loading').style.display = 'none';
      } catch (error) {
        console.error('حدث خطأ أثناء تحميل البيانات:', error);
      }
    }

    // دالة تعبئة جدول ترتيب الطلاب
    function populateStudentsTable(studentsData) {
      const studentsTableBody = document.querySelector('#students-table tbody');
      studentsData.forEach(student => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${student["اسم الطالب"]}</td>
          <td>${student["CGPA"]}</td>
          <td>${student["الترتيب العام"]}</td>
          <td>${student["Second Semester GPA"]}</td>
          <td>${student["ترتيب الترم"]}</td>
        `;
        studentsTableBody.appendChild(row);
      });
    }

    // دالة تعبئة ترتيب المواد داخل بطاقات قابلة للطي
    function populateCourseRankings(courseData) {
      const coursesRankingDiv = document.getElementById('courses-ranking');
      for (const [courseName, students] of Object.entries(courseData)) {
        const safeCourseName = generateSafeId(courseName);
        const card = document.createElement('div');
        card.className = 'card mb-3';
        card.innerHTML = `
          <div class="card-header" data-toggle="collapse" data-target="#collapse-${safeCourseName}" 
               aria-expanded="false">
            ${courseName}
          </div>
          <div id="collapse-${safeCourseName}" class="collapse">
            <div class="card-body">
              <div class="table-responsive">
                <table class="table table-bordered table-hover">
                  <thead>
                    <tr>
                      <th>اسم الطالب</th>
                      <th>الدرجة</th>
                      <th>الترتيب</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${students.map(student => `
                      <tr>
                        <td>${student[0]}</td>
                        <td>${student[1]}</td>
                        <td>${student[2]}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
        coursesRankingDiv.appendChild(card);
      }
    }

    // دالة لتحديث تمييز نتائج البحث في العناصر
    function highlightMatches(element, filter) {
      element.innerHTML = element.textContent;
      if (filter.trim() === '') return;
      const regex = new RegExp(`(${filter})`, 'gi');
      element.innerHTML = element.textContent.replace(regex, '<span class="highlight">$1</span>');
    }

    // التصفية الشاملة عند كتابة نص في مدخل البحث
    $('#searchInput').on('keyup', function() {
      const filter = this.value.trim().toLowerCase();
      
      studentsTable.search(filter).draw();
      
      const courseCards = document.querySelectorAll('#courses-ranking .card');
      courseCards.forEach(card => {
        const cardText = card.textContent.toLowerCase();
        card.style.display = cardText.includes(filter) ? '' : 'none';
      });
    });

    // تبديل الوضع بين المظلم والعادي
    $('#toggleMode').on('click', function() {
      $('body').toggleClass('dark-mode');
    });

    loadData(); // تحميل البيانات عند تحميل الصفحة
  </script>
</body>
</html>
