<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتيجة الفرقة الثانية تمريض 2025</title>
    <style>
        body {
            font-family: 'Tajawal', sans-serif; /* خط عربي أنيق */
            direction: rtl;
            background-color: #f0f8ff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 20px;
            padding: 40px;
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #2c3e50; /* لون داكن أنيق */
            font-size: 28px;
            margin-bottom: 25px;
            font-weight: 700;
        }

        p {
            font-size: 18px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .note {
            font-size: 16px;
            color: #777;
            margin-top: 20px;
        }

        /* زر افتراضي */
        .button {
            display: inline-block;
            padding: 12px 30px;
            font-size: 16px;
            color: #fff;
            background-color: #4CAF50;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .button:hover {
            background-color: #45a049;
        }

        /* رابط */
        a {
            color: #4CAF50;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        /* التنسيق للهواتف */
        @media (max-width: 768px) {
            h1 {
                font-size: 24px;
            }

            p {
                font-size: 16px;
            }

            .button {
                padding: 10px 25px;
                font-size: 14px;
            }
        }
    </style>
    <!-- رابط خط Tajawal من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <h1>نتيجة الفرقة الثانية تمريض 2025</h1>
        <p>جاري رفع النتيجة...</p>
        <p>تراقبوا النتيجة بالاسم، رقم الجلوس، وترتيبك في الدفعة في كل السنين، بالإضافة إلى ترتيب الترم الحالي.</p>
        <p class="note">تابعنا على <a href="https://t.me/Nursingology2025" target="_blank">تليجرام</a> للحصول على التحديثات أولاً بأول.</p>
    </div>

</body>
</html>
